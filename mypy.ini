[mypy]

# pycti and stix2 (open-cti/connectors/vs-org-bootstrap/) have no stub packages available on
# PyPI/typeshed at all -- unlike types-PyYAML/types-psycopg2 (added to .pre-commit-config.yaml's
# mypy hook instead, since those genuinely exist), there's no "pip install types-X" that fixes
# this for these two. Scoped narrowly rather than a repo-wide ignore_missing_imports.
[mypy-pycti.*]
ignore_missing_imports = True

[mypy-stix2.*]
ignore_missing_imports = True

# boto3 has real stubs available (boto3-stubs), but they're a heavy, per-service package and
# boto3 is already imported repo-wide in backend/ without them -- matching that existing
# precedent here rather than introducing a different standard for just this one new directory.
[mypy-boto3.*]
ignore_missing_imports = True
