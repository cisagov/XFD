---
name: Check for Vulnerabilities (CISADEV Runner)

on:
  schedule:
    - cron: "0 1 * * *"  # every day at 1 AM
  workflow_dispatch:
  push:

jobs:
  backend:
    if: vars.ENABLE_CISADEV_WORKFLOWS == 'true'
    runs-on: [self-hosted, xfd-runner-group]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.19.4'
      - name: Install dependencies
        run: npm ci
      - name: Security
        run: npm audit --production

  frontend:
    if: vars.ENABLE_CISADEV_WORKFLOWS == 'true'
    runs-on: [self-hosted, xfd-runner-group]
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.19.4'
      - name: Install dependencies
        run: npm ci
      - name: Security
        run: npm audit --production

  docs:
    if: vars.ENABLE_CISADEV_WORKFLOWS == 'true'
    runs-on: [self-hosted, xfd-runner-group]
    defaults:
      run:
        working-directory: ./docs
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20.19.4'
      - name: Install dependencies
        run: npm ci
      - name: Security
        run: npm audit --production

  backend_python:
    if: vars.ENABLE_CISADEV_WORKFLOWS == 'true'
    runs-on: [self-hosted, xfd-runner-group]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v5.0.0
        with:
          python-version: '3.10'
