---
# One-off, manually-triggered workflow to inspect a `terraform plan` against the
# staging-cd remote state with real CI credentials, without mutating anything.
#
# This file originally performed one-time state surgery to adopt the existing
# OpenCTI EC2 instance (i-033771e2a6a9a26ca) into Terraform state as
# `aws_instance.open_cti` (see git history for that version, and PR discussion
# for the corrupted-plan issue it fixed). That surgery is already complete --
# `aws_instance.pe[0]` has been removed from state and `aws_instance.open_cti[0]`
# is now the sole tracked address for that instance.
#
# This version is read-only: init + validate + plan, nothing else. No `-out` is
# written, so there's no plan artifact anything could later `apply` -- that's
# deliberate, not an oversight. Use this to inspect what a real plan looks like
# with proper CI credentials before deciding whether/what to merge.
#
# Dispatch this from any branch that has this file -- no need to merge to
# develop/integration first. Merging to develop triggers the regular
# Infrastructure Pipeline (.github/workflows/infrastructure.yml), which DOES
# auto-apply on push with no approval gate; this workflow exists specifically
# so you can inspect a plan before that happens.
name: Inspect OpenCTI Terraform Plan

on:
  workflow_dispatch: {}

env:
  URL: https://releases.hashicorp.com/terraform/1.0.7/terraform_1.0.7_linux_amd64.zip

defaults:
  run:
    working-directory: ./infrastructure

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: staging
    # Same literal group as infrastructure.yml's staging job -- concurrency
    # groups are matched repo-wide, not per-workflow, so this queues behind
    # (rather than races) a real apply run instead of reading state mid-mutation.
    concurrency: '1'
    steps:
      - uses: actions/checkout@v3

      - name: Install Terraform
        run: |
          wget ${{ env.URL }}
          unzip terraform_1.0.7_linux_amd64.zip
          sudo mv terraform /usr/local/bin

      - name: Terraform init
        run: terraform init -backend-config=stage-cd.config
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan (read-only -- no -out, nothing to apply)
        run: terraform plan -no-color -var-file=stage-cd.tfvars
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "us-east-1"
