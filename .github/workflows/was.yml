---
name: WAS Pipeline

on:
  push:
    branches:
      - develop
      - integration
    paths:
      - backend/was/**
      - .github/workflows/was.yml
  pull_request:
    branches:
      - develop
      - integration
    paths:
      - backend/was/**
      - .github/workflows/was.yml

jobs:
  test:
    name: Run WAS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: was_test_ci
          POSTGRES_USER: was_test_runner
          POSTGRES_PASSWORD: was_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U was_test_runner -d was_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      WAS_TEST_DATABASE_DSN: >-
        postgresql://was_test_runner:was_test_password@127.0.0.1:5432/was_test_ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/was/requirements.txt
      - name: Install WAS dependencies
        working-directory: ./backend/was
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install --no-deps --editable .
      - name: Run WAS unit and PostgreSQL integration tests
        working-directory: ./backend/was
        run: make test PYTHON=python ROOT_PYTHON=python
