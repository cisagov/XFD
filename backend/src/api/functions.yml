---
api:
  handler: src.xfd_django.xfd_django.asgi.handler

  events:
    - http:
        path: /
        method: ANY
        cors:
          origins:
            - ${file(env.yml):${self:provider.stage}.FRONTEND_DOMAIN}
          headers:
            - Content-Type
            - Authorization
            - X-API-KEY
            - X-Amz-Security-Token
            - X-Amz-Date
            - X-Amzn-Trace-Id
            - Accept
            - Origin
            - Cache-Control
            - Pragma
          allowCredentials: true

    - http:
        path: /{any+}
        method: ANY
        cors:
          origins:
            - ${file(env.yml):${self:provider.stage}.FRONTEND_DOMAIN}
          headers:
            - Content-Type
            - Authorization
            - X-API-KEY
            - X-Amz-Security-Token
            - X-Amz-Date
            - X-Amzn-Trace-Id
            - Accept
            - Origin
            - Cache-Control
            - Pragma
          allowCredentials: true

  layers:
    - ${self:custom.adot.pythonLayerArn.${self:provider.stage}}
