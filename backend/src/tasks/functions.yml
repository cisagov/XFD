peScanController:
  <<: *adot
  timeout: 900
  maximumRetryAttempts: 0
  memorySize: 512
  handler: pe.peScanController.handler
  environment:
    # pe_source lives under pe/src/ in the deployment zip; include it for keyed
    # scan API-key validation (flare_events, shodan, ...).
    PYTHONPATH: .:pe/src
    PE_DB_HOST: ${ssm:/crossfeed/staging/PE_DB_HOST}
    PE_DB_NAME: ${ssm:/crossfeed/staging/PE_DB_NAME}
    PE_DB_USERNAME: ${ssm:/crossfeed/staging/PE_DB_USERNAME}
    PE_DB_PASSWORD: ${ssm:/crossfeed/staging/PE_DB_PASSWORD}
  events:
    # RATE:
      # EventBridge evaluates in UTC by default.

      # Have adjusted the cron expressions below to run at the
      # desired local time in EDT.

      # Cron jobs running after 1:59 AM will vary by 1 hour
      # depending on whether DST is in effect.

      # EST = UTC-5
      # EDT = UTC-4

    # ORGS:
      # "all" - load is handled by one container.

      # "all-orgs" - load is distributed equally across multiple worker containers.
        # Creates a queue of tasks, one for each PE customer/organization.
        # Worker containers then work through that queue together.
        # Ensures load balancing and working in parallel until all tasks are complete.

    - schedule:
        name: pe-dnsmonitor-semi-monthly
        description: "Semi-monthly dnsmonitor scan for all orgs"
        # Runs the 1st and 16th of every month at 12:15 AM EST/EDT
        rate: cron(15 4 1,16 * ? *)
        enabled: true
        input:
          scans: ["dnsmonitor"]
          orgs: ["all"]
          taskCount: 1
    - schedule:
        name: pe-dnstwist-semi-monthly
        description: "Semi-monthly dnstwist scan"
        # Runs the 14th and 27th of every month at 12:30 AM EST/EDT
        rate: cron(30 4 14,27 * ? *)
        enabled: true
        input:
          scans: ["dnstwist"]
          orgs: ["all-orgs"]
          # Currently limited to 10 containers due to queuing configuration.
          # Will be addressed with a future To-Do.
          taskCount: 10
    - schedule:
        name: pe-flare-events-semi-monthly
        description: "Semi-monthly flare events scan"
        # Runs the 1st and 16th of every month at 12:00 AM EST/EDT
        rate: cron(0 4 1,16 * ? *)
        enabled: true
        input:
          scans: ["flare_events"]
          orgs: ["all-orgs"]
          taskCount: 2
    - schedule:
        name: pe-flare-leaked-credentials-semi-monthly
        description: "Semi-monthly flare leaked credentials scan"
        # Runs the 1st and 16th of every month at 5:00 AM EST/6:00 AM EDT
        rate: cron(0 10 1,16 * ? *)
        enabled: true
        input:
          scans: ["flare_creds"]
          orgs: ["all-orgs"]
          taskCount: 2
    - schedule:
        name: pe-shodan-semi-monthly
        description: "Semi-monthly shodan scan"
        # Runs the 1st and 16th of every month at 12:30 AM EST/EDT
        rate: cron(30 4 1,16 * ? *)
        enabled: true
        input:
          scans: ["shodan"]
          orgs: ["all"]
          taskCount: 1
    - schedule:
        name: pe-shodan-top-cves-semi-monthly
        description: "Semi-monthly shodan top CVEs scan"
        # Runs the 1st and 16th of every month at 5:00 AM EST/6:00 AM EDT
        rate: cron(0 10 1,16 * ? *)
        enabled: true
        input:
          scans: ["shodan_top_cves"]
          orgs: ["all"]
          taskCount: 1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:GetQueueUrl
        - sqs:GetQueueAttributes
        - sqs:CreateQueue
        - sqs:SetQueueAttributes
      Resource: '*'
    - Effect: Allow
      Action:
        - ecs:RunTask
        - ecs:DescribeTasks
      Resource: '*'
    - Effect: Allow
      Action:
        - iam:PassRole
      Resource: '*'
    - Effect: Allow
      Action:
        - kms:Decrypt
        - kms:DescribeKey
      Resource:
        - ${file(env.yml):${self:provider.stage}.DJANGO_ENV_KMS_ARN}

