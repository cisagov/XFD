---
scheduler:
  # ADOT: define common layer+env once and anchor it for reuse, see all
  # functions below for usage of the anchor.
  <<: &adot
    layers: ${self:custom.adotLayers}
    environment:
      OTEL_RESOURCE_ATTRIBUTES: >
        service.name=crossfeed-tasks,
        service.namespace=crossfeed,
        deployment.environment=${self:provider.stage}

  handler: src.xfd_django.xfd_api.tasks.scheduler.handler
  # TODO: Parameterize the timeout value,
  # at a future date see CRASM-3270. See all timeouts below.
  timeout: 900
  events:
    - schedule: rate(5 minutes)
  reservedConcurrency: 1
  memorySize: 4096
  iamRoleStatements:
    - Effect: Allow
      Action:
        - sqs:CreateQueue
        - sqs:ListQueues
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:SendMessage
        - sqs:GetQueueAttributes
      Resource: '*'
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: '*'
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:GetObjectAcl
        - s3:PutObject
        - s3:PutObjectAcl
        - s3:PutBucketAcl
        - s3:GetBucketAcl
      Resource: '*'
    - Effect: Allow
      Action:
        - ecs:RunTask
        - ecs:ListTasks
        - ecs:DescribeTasks
        - ecs:DescribeServices
        - ecs:UpdateService
        - iam:PassRole
        - logs:GetLogEvents
      Resource: '*'
    - Effect: Allow
      Action:
        - iam:PassRole
      Resource: '*'
    - Effect: Allow
      Action:
        - kms:Decrypt
        - kms:DescribeKey
      Resource:
        - arn:aws:kms:${self:provider.region}:${aws:accountId}:alias/django-env-config

