  ###########################
  # OPENCTI DEFAULT DATA    #
  ###########################

  connector-opencti:
    image: opencti/connector-opencti:latest
    # See connector-import-external-reference (VS CUSTOM CONNECTORS section above) --
    # same Zscaler trust setup, for the outbound fetch of Filigran's reference datasets.
    volumes:
      - "${ZSCALER_CERT_DIR:-/opt/open-cti/tls}/combined-ca-bundle.pem:/etc/ssl/certs/zscaler-combined-ca-bundle.pem:ro"
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_OPENCTI_ID}
      - "CONNECTOR_NAME=OpenCTI Datasets"
      - CONNECTOR_SCOPE=marking-definition,identity,location
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=100
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
    restart: always
    depends_on:
      opencti:
        condition: service_healthy
  connector-mitre:
    image: opencti/connector-mitre:latest
    # Same Zscaler trust setup, for the outbound MITRE ATT&CK STIX bundle fetch
    # (raw.githubusercontent.com).
    volumes:
      - "${ZSCALER_CERT_DIR:-/opt/open-cti/tls}/combined-ca-bundle.pem:/etc/ssl/certs/zscaler-combined-ca-bundle.pem:ro"
    environment:
      - OPENCTI_URL=http://opencti:8080
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - CONNECTOR_ID=${CONNECTOR_MITRE_ID}
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT=true
      - CONNECTOR_AUTO_CREATE_SERVICE_ACCOUNT_CONFIDENCE_LEVEL=75
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
    restart: always
    depends_on:
      opencti:
        condition: service_healthy

  ###########################
  # XTM ONE                 #
  ###########################

  xtm-one:
    image: xtmone/platform:latest
    # Zscaler TLS-inspects outbound HTTPS on this network. Runtime here is inferred,
    # not directly confirmed (no public Dockerfile for xtmone/platform) --
    # DATABASE_URL's postgresql+asyncpg scheme is a strong Python signal, so treated
    # the same as the other Python services (combined bundle, not additive). See
    # connectors/vs-org-bootstrap/README.md "TLS interception" -> "Non-custom
    # connectors" -- worth confirming against real container logs.
    volumes:
      - "${ZSCALER_CERT_DIR:-/opt/open-cti/tls}/combined-ca-bundle.pem:/etc/ssl/certs/zscaler-combined-ca-bundle.pem:ro"
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - PLATFORM_MODE=xtm_one
      - PLATFORM_REGISTRATION_TOKEN=${PLATFORM_REGISTRATION_TOKEN}
      - BASE_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - FRONTEND_URL=${XTM_ONE_EXTERNAL_SCHEME}://${XTM_ONE_HOST}:${XTM_ONE_PORT}
      - ADMIN_EMAIL=${XTM_ONE_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${XTM_ONE_ADMIN_PASSWORD}
      - SECRET_KEY=${XTM_ONE_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql-xtm-one:5432/xtm_one
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${XTM_ONE_S3_BUCKET:-xtm-one-files}
      - S3_USE_SSL=false
      - LOG_LEVEL=${XTM_ONE_LOG_LEVEL:-info}
      - LOG_FORMAT=${XTM_ONE_LOG_FORMAT:-json}
      - ENTERPRISE_LICENSE=${XTM_ONE_ENTERPRISE_LICENSE:-}
      # Internal API endpoint for the OpenCTI integration (Docker hostname)
      - OPENCTI_API_URL=http://opencti:8080
    ports:
      - "${XTM_ONE_PORT}:4000"
    depends_on:
      pgsql-xtm-one:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  xtm-one-worker:
    image: xtmone/worker:latest
    # Same inferred Python/Zscaler treatment as xtm-one above -- see its comment.
    volumes:
      - "${ZSCALER_CERT_DIR:-/opt/open-cti/tls}/combined-ca-bundle.pem:/etc/ssl/certs/zscaler-combined-ca-bundle.pem:ro"
    environment:
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - SSL_CERT_FILE=/etc/ssl/certs/zscaler-combined-ca-bundle.pem
      - PLATFORM_MODE=xtm_one
      - PLATFORM_REGISTRATION_TOKEN=${PLATFORM_REGISTRATION_TOKEN}
      - ADMIN_EMAIL=${XTM_ONE_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${XTM_ONE_ADMIN_PASSWORD}
      - SECRET_KEY=${XTM_ONE_SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${XTM_ONE_POSTGRES_USER}:${XTM_ONE_POSTGRES_PASSWORD}@pgsql-xtm-one:5432/xtm_one
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=${XTM_ONE_S3_BUCKET:-xtm-one-files}
      - S3_USE_SSL=false
      - LOG_LEVEL=${XTM_ONE_LOG_LEVEL:-info}
      - LOG_FORMAT=${XTM_ONE_LOG_FORMAT:-json}
      - ENTERPRISE_LICENSE=${XTM_ONE_ENTERPRISE_LICENSE:-}
    depends_on:
      xtm-one:
        condition: service_healthy
    restart: always

volumes:
  esdata:
  s3data:
  redisdata:
  amqpdata:
  rsakeys:
  pgsqlxtmonedata:
