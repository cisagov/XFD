---
default_language_version:
  # force all unspecified python hooks to run python3
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
        exclude: dev.env.example
      - id: end-of-file-fixer
        exclude: files/(issue|motd)
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: pretty-format-json
        args:
          - --autofix
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        exclude: .*.snap

  # Text file hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.36.0
    hooks:
      - id: markdownlint
        args:
          - --config=.mdl_config.yaml
  - repo: https://github.com/kaechele/pre-commit-mirror-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.32.0
    hooks:
      - id: yamllint
        args:
          - --strict
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: >
          bash -c 'export NVM_DIR="$HOME/.nvm";
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" --no-use
          && nvm use || true;
          cd frontend && npx eslint . --cache --fix'
        language: system
        files: ^frontend/src/.*\.(js|jsx|ts|tsx)$

  # GitHub Actions hooks
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.26.3
    hooks:
      - id: check-github-actions
      - id: check-github-workflows

  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit
    rev: v3.4.0
    hooks:
      - id: validate_manifest

  # Shell script hooks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        language: python
        language_version: python3.11
        entry: shfmt
        args:
          # Indent by two spaces
          - -i
          - '2'
          # Binary operators may start a line
          - -bn
          # Switch cases are indented
          - -ci
          # Redirect operators are followed by a space
          - -sr
  - repo: https://github.com/detailyang/pre-commit-shell
    rev: 1.0.5
    hooks:
      - id: shell-lint

  # Python hooks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args:
          - --config=.bandit.yml
        additional_dependencies: ["pbr>=6"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.9.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-docstrings
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: flake8 (no print in backend)
        files: ^backend/
        additional_dependencies:
          - flake8-print
        args: [--select=T20]
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.1
    hooks:
      - id: mypy
        # Excludes every VS connector below (all four now built -- see
        # OpenCTI-connector.md §8's build order). Each has its own
        # config/db/mapping/connector module under a bare `src` package (§10i:
        # built structurally identical on purpose) -- checking them in one mypy
        # invocation (this hook's repo-wide sweep, or the connectors against each
        # other) fails with "Duplicate module named 'src...'", since mypy keys its
        # module graph by dotted name, not file path, and every connector resolves
        # to the same names (`src.db`, `src.mapping`, ...). Checked independently
        # below instead -- same per-subtree scoping this file already uses for the
        # backend-only flake8 hook (T20/print-statements) further up.
        exclude: ^open-cti/connectors/(vs-org-bootstrap|vs-ticket-ingestion|vs-vulnscan-enrichment|vs-port-inventory)/
        additional_dependencies:
          - types-requests
          - types-retry
          - types-PyYAML
          - types-psycopg2
          - types-python-dateutil
          - redis==5.2.0
      - id: mypy
        name: "mypy (connector: vs-org-bootstrap)"
        files: ^open-cti/connectors/vs-org-bootstrap/
        additional_dependencies:
          - types-PyYAML
          - types-psycopg2
      - id: mypy
        name: "mypy (connector: vs-ticket-ingestion)"
        files: ^open-cti/connectors/vs-ticket-ingestion/
        additional_dependencies:
          - types-PyYAML
          - types-psycopg2
          - types-python-dateutil
      - id: mypy
        name: "mypy (connector: vs-vulnscan-enrichment)"
        files: ^open-cti/connectors/vs-vulnscan-enrichment/
        additional_dependencies:
          - types-PyYAML
          - types-psycopg2
      - id: mypy
        name: "mypy (connector: vs-port-inventory)"
        files: ^open-cti/connectors/vs-port-inventory/
        additional_dependencies:
          - types-PyYAML
          - types-psycopg2
          - types-python-dateutil
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.10.1
    hooks:
      - id: pyupgrade

  # Terraform hooks
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
          - --hook-config=--retry-once-with-cleanup=true
  - repo: local
    hooks:
      - id: terraform-dedupe-sort
        name: "Terraform HCL: dedupe, sort & duplicate‑variable check"
        entry: python hooks/terraform_dedupe_sort.py
        language: python
        files: \.tf$

  # Docker hooks
  - repo: https://github.com/IamTheFij/docker-pre-commit
    rev: v3.0.1
    hooks:
      - id: docker-compose-check
